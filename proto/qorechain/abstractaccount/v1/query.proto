syntax = "proto3";
package qorechain.abstractaccount.v1;

import "google/api/annotations.proto";
import "gogoproto/gogo.proto";
import "qorechain/abstractaccount/v1/tx.proto";

option go_package = "github.com/qorechain/qorechain-core/x/abstractaccount/types";

// Query defines the gRPC query service for the abstractaccount module.
service Query {
  // Config returns the module config.
  // "/params" is served too: the module has no params, and the API reference
  // listed that path for it.
  rpc Config(QueryConfigRequest) returns (QueryConfigResponse) {
    option (google.api.http) = {
      get: "/qorechain/abstractaccount/v1/config"
      additional_bindings {get: "/qorechain/abstractaccount/v1/params"}
    };
  }
  // Account returns a single abstract account by address. The singular
  // "/account/{address}" path, which the API reference listed, is an alias.
  rpc Account(QueryAccountRequest) returns (QueryAccountResponse) {
    option (google.api.http) = {
      get: "/qorechain/abstractaccount/v1/accounts/{address}"
      additional_bindings {get: "/qorechain/abstractaccount/v1/account/{address}"}
    };
  }
  // Accounts lists all abstract accounts.
  rpc Accounts(QueryAccountsRequest) returns (QueryAccountsResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/accounts";
  }
  // PermissionSchema returns the canonical authenticator permission taxonomy so
  // clients (QoreX/dashboard/relayer) validate scopes without hardcoding strings
  // and detect drift via schema_version (v3.1.85).
  rpc PermissionSchema(QueryPermissionSchemaRequest) returns (QueryPermissionSchemaResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/permission_schema";
  }
  // AuthNonce returns the sequence a linked authenticator key must sign next
  // for an account: the nonce MsgExecuteEVM and MsgExecuteCosmos must carry
  // (QSR-2026-0596). It is the key's own counter, not the account's EVM nonce.
  rpc AuthNonce(QueryAuthNonceRequest) returns (QueryAuthNonceResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/auth_nonce/{address}/{pubkey_hex}";
  }
  // SpendingRules returns the spending rules stored for an account: the
  // account-wide rules and the rule of every linked key that carries its own.
  // The account view only counts them, so an owner could not read back what
  // MsgUpdateSpendingRules saved.
  rpc SpendingRules(QuerySpendingRulesRequest) returns (QuerySpendingRulesResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/accounts/{address}/spending_rules";
  }
  // Authenticators returns the keys linked to an account, revoked ones
  // included, with their permissions and expiry.
  rpc Authenticators(QueryAuthenticatorsRequest) returns (QueryAuthenticatorsResponse) {
    option (google.api.http).get = "/qorechain/abstractaccount/v1/accounts/{address}/authenticators";
  }
}

message QuerySpendingRulesRequest {
  // address is the account's bech32 address.
  string address = 1;
}

message QuerySpendingRulesResponse {
  // rules are the account-wide rules in stored order; the first enabled one
  // bounds every linked key without a rule of its own.
  repeated SpendingRule rules = 1 [(gogoproto.nullable) = false];
  // authenticator_rules are the per-key rules.
  repeated AuthenticatorRule authenticator_rules = 2 [(gogoproto.nullable) = false];
}

// AuthenticatorRule is the rule a linked key carries itself.
message AuthenticatorRule {
  string scheme = 1;
  // pubkey_hex is the key, hex encoded.
  string pubkey_hex = 2;
  SpendingRule rule = 3 [(gogoproto.nullable) = false];
}

message QueryAuthenticatorsRequest {
  // address is the account's bech32 address.
  string address = 1;
}

message QueryAuthenticatorsResponse {
  repeated AuthenticatorView authenticators = 1 [(gogoproto.nullable) = false];
}

message AuthenticatorView {
  string scheme = 1;
  // pubkey_hex is the key, hex encoded.
  string pubkey_hex = 2;
  repeated string permissions = 3;
  // expiry_unix and created_at_unix are unix seconds.
  int64 expiry_unix = 4;
  string label = 5;
  int64 created_at_unix = 6;
  bool revoked = 7;
  // has_spend_rule reports a rule of the key's own (see SpendingRules).
  bool has_spend_rule = 8;
}

message QueryAuthNonceRequest {
  // address is the account's bech32 address.
  string address = 1;
  // pubkey_hex is the authenticator public key, hex encoded (0x optional).
  string pubkey_hex = 2;
}

message QueryAuthNonceResponse {
  // nonce is the next expected sequence; 0 for a key that has never executed.
  uint64 nonce = 1;
  // linked reports whether the key is currently an authenticator of the
  // account (present and not revoked); the nonce is kept either way.
  bool linked = 2;
}

message ConfigView {
  bool enabled = 1;
  int32 max_session_keys = 2;
  int32 max_spending_rules = 3;
  int64 default_session_ttl = 4;
}

message AccountView {
  string address = 1;
  string contract_address = 2;
  string account_type = 3;
  uint32 spending_rules_count = 4;
  uint32 session_keys_count = 5;
  int64 created_at = 6;
  string owner = 7;
  // authenticators_count is the number of linked keys that are not revoked.
  // session_keys_count counts the legacy session keys only.
  uint32 authenticators_count = 8;
}

message QueryConfigRequest {}
message QueryConfigResponse { ConfigView config = 1; }

message QueryAccountRequest { string address = 1; }
message QueryAccountResponse { AccountView account = 1; }

message QueryAccountsRequest {}
message QueryAccountsResponse { repeated AccountView accounts = 1; }

message QueryPermissionSchemaRequest {}
message QueryPermissionSchemaResponse {
  // schema_version bumps whenever the taxonomy or the mapping changes; clients
  // compare it to their embedded copy to detect drift.
  string schema_version = 1;
  // permissions is every valid permission string (e.g. send, evm, svm, all).
  repeated string permissions = 2;
  // msg_permissions maps a message typeURL to the permission it requires.
  map<string, string> msg_permissions = 3;
  // key_management_msgs are typeURLs that are NEVER delegable to a linked key.
  repeated string key_management_msgs = 4;
  // lane_rules (schema_version 2 and later) are permission requirements that
  // depend on a message's content rather than its type, such as a contract
  // creation through MsgExecuteEVM needing "deploy".
  repeated LaneRule lane_rules = 5;
}

// LaneRule states that a message matching condition requires permission.
message LaneRule {
  string msg_type_url = 1;
  string condition = 2;
  string permission = 3;
}
