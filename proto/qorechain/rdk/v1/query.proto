syntax = "proto3";
package qorechain.rdk.v1;

option go_package = "github.com/qorechain/qorechain-core/x/rdk/types";

import "google/api/annotations.proto";

// Query defines the gRPC query service for the rdk (rollup) module.
//
// Every RPC is also served over REST by the gRPC gateway, under
// /qorechain/rdk/v1/. Rollup ids are restricted to [a-z0-9._-] from v3.2.2,
// so an id is always a single clean path segment.
service Query {
  // Params returns the module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/params";
  }
  // Rollup returns a single rollup config by ID.
  rpc Rollup(QueryRollupRequest) returns (QueryRollupResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/rollup/{rollup_id}";
  }
  // Rollups lists all rollups.
  rpc Rollups(QueryRollupsRequest) returns (QueryRollupsResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/rollups";
  }
  // Batch returns a settlement batch by (rollup_id, batch_index).
  rpc Batch(QueryBatchRequest) returns (QueryBatchResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/batch/{rollup_id}/{batch_index}";
  }
  // LatestBatch returns the latest settlement batch for a rollup.
  rpc LatestBatch(QueryLatestBatchRequest) returns (QueryLatestBatchResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/latest_batch/{rollup_id}";
  }
  // Batches lists a rollup's settlement batches in index order, starting at
  // start_index, at most limit of them (default 50, maximum 100).
  rpc Batches(QueryBatchesRequest) returns (QueryBatchesResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/batches/{rollup_id}";
  }
  // Blob returns a data-availability blob's metadata (not its data).
  rpc Blob(QueryBlobRequest) returns (QueryBlobResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/blob/{rollup_id}/{blob_index}";
  }
  // PostedData returns one posted-data commitment (v3.2.8,
  // rdk-post-rollup-data). The payload is in the transaction of the block at
  // height.
  rpc PostedData(QueryPostedDataRequest) returns (QueryPostedDataResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/posted_data/{rollup_id}/{sequence}";
  }
  // Inbox returns a rollup's inbox: head, consumed position, accumulators and
  // the data_hash a based batch ending at inbox_end (0 = the head) must carry.
  rpc Inbox(QueryInboxRequest) returns (QueryInboxResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/inbox/{rollup_id}";
  }
  // SubmitterBond returns an account's submitter bond on a qledger-v1
  // rollup and the earliest block time it can be unbonded (v3.2.8,
  // rdk-optimistic-reexec).
  rpc SubmitterBond(QuerySubmitterBondRequest) returns (QuerySubmitterBondResponse) {
    option (google.api.http).get = "/qorechain/rdk/v1/submitter_bond/{rollup_id}/{submitter}";
  }
}

// ParamsView is the query-facing view of the module parameters.
message ParamsView {
  uint32 max_rollups = 1;
  int64 min_stake_for_rollup = 2;
  string rollup_creation_burn_rate = 3;
  uint64 default_challenge_window = 4;
  uint64 max_da_blob_size = 5;
  uint64 blob_retention_blocks = 6;
  uint32 max_batches_per_block = 7;
  // finalized_batch_retention_blocks is the effective retention, with the
  // default filled in for a stored 0.
  uint64 finalized_batch_retention_blocks = 8;
  // The posted-data parameters (v3.2.8), effective values with the defaults
  // filled in for a stored 0.
  uint64 max_posted_data_bytes = 9;
  uint64 max_posted_data_bytes_per_block = 10;
  uint64 posted_data_fee_per_byte = 11;
  uint64 posted_data_retention_blocks = 12;
  // min_submitter_bond (v3.2.8), effective value.
  uint64 min_submitter_bond = 13;
}

// RollupView is the query-facing view of a rollup config (scalar fields).
message RollupView {
  string rollup_id = 1;
  string creator = 2;
  string profile = 3;
  string settlement_mode = 4;
  string da_backend = 5;
  uint64 block_time_ms = 6;
  uint64 max_tx_per_block = 7;
  string vm_type = 8;
  string status = 9;
  int64 stake_amount = 10;
  string layer_id = 11;
  int64 created_height = 12;
  // escrow_balance is what the rollup still holds in the pooled module
  // escrow, in uqor: what its withdrawals can still pay and what stopping it
  // refunds. It is read from the per-rollup escrow ledger (from v3.2.3).
  uint64 escrow_balance = 13;
  // challenge_window_sec, challenge_bond and proof_system are the rollup's own
  // proof configuration, so a watchtower can tell when a batch's challenge
  // window closes and what a challenge costs without assuming the module
  // default.
  uint64 challenge_window_sec = 14;
  int64 challenge_bond = 15;
  string proof_system = 16;
  // has_verification_key is true when the rollup has a ZK verification key
  // registered (from v3.2.7 a zk rollup can register one). A zk batch of a
  // rollup without one is refused.
  bool has_verification_key = 17;
  // sequencing is "" (the rollup's sequencer settles) or "based" (v3.2.8,
  // rdk-based-sequencing): anyone posts data, batches consume the inbox in
  // order, and a zk (snark) based rollup accepts batches from anyone.
  string sequencing = 18;
  // execution_vm (v3.2.8): "qledger-v1" for an optimistic rollup whose
  // batches a fraud proof re-executes, else empty.
  string execution_vm = 19;
  // privacy (v3.2.8): "encapsulated" for a private rollup, else empty.
  string privacy = 20;
  // members and members_epoch: a private rollup's member list and epoch.
  repeated string members = 21;
  uint64 members_epoch = 22;
  // deposit_pool: uqor deposited into a qledger-v1 rollup and not yet
  // withdrawn.
  uint64 deposit_pool = 23;
}

// BatchView is the query-facing view of a settlement batch.
message BatchView {
  string rollup_id = 1;
  uint64 batch_index = 2;
  string state_root = 3;
  string prev_state_root = 4;
  uint64 tx_count = 5;
  string data_hash = 6;
  string proof_type = 7;
  string status = 8;
  int64 submitted_at = 9;
  int64 finalized_at = 10;
  string withdrawals_root = 11;
  // submitted_time is the block time (unix seconds) of the block that settled
  // the batch, recorded from rdk-challenge-window-time (v3.2.4). Zero for a
  // batch settled before the switch, whose challenge window still counts in
  // blocks (submitted_at + challenge_window_sec / 6). A batch with a time
  // closes when block time >= submitted_time + the rollup's
  // challenge_window_sec.
  int64 submitted_time = 12;
  // withdrawals_bound marks a batch settled from rdk-withdrawals-binding
  // (v3.2.5): its transition binding and proofs commit the withdrawals root
  // and the chain id, and its withdrawal leaves start with the chain id. False
  // for a batch settled before the switch, whose leaves are the v1 form.
  bool withdrawals_bound = 13;
  // inbox_start and inbox_end are, for a batch of a based rollup (v3.2.8),
  // the inbox range it consumed: the posts after inbox_start up to inbox_end.
  uint64 inbox_start = 14;
  uint64 inbox_end = 15;
}

message QueryParamsRequest {}
message QueryParamsResponse { ParamsView params = 1; }

message QueryRollupRequest { string rollup_id = 1; }
message QueryRollupResponse { RollupView rollup = 1; }

message QueryRollupsRequest {}
message QueryRollupsResponse { repeated RollupView rollups = 1; }

message QueryBatchRequest {
  string rollup_id = 1;
  uint64 batch_index = 2;
}
message QueryBatchResponse { BatchView batch = 1; }

message QueryLatestBatchRequest { string rollup_id = 1; }
message QueryLatestBatchResponse { BatchView batch = 1; }

message QueryBatchesRequest {
  string rollup_id = 1;
  // start_index is the first batch index returned.
  uint64 start_index = 2;
  // limit caps the number of batches returned: 0 means 50, and more than 100
  // is capped at 100.
  uint32 limit = 3;
}
message QueryBatchesResponse {
  repeated BatchView batches = 1;
  // next_index is the start_index of the next page, 0 when there is none.
  uint64 next_index = 2;
}

// BlobView is the query-facing view of a data-availability blob, without the
// blob data itself.
message BlobView {
  string rollup_id = 1;
  uint64 blob_index = 2;
  string commitment = 3;
  uint64 data_size = 4;
  int64 height = 5;
  string stored_at = 6;
  bool pruned = 7;
  // expires_at_height is the height after which the blob may be pruned.
  int64 expires_at_height = 8;
}

message QueryBlobRequest {
  string rollup_id = 1;
  uint64 blob_index = 2;
}
message QueryBlobResponse { BlobView blob = 1; }

// PostedDataView is one posted-data commitment (v3.2.8).
message PostedDataView {
  string rollup_id = 1;
  uint64 sequence = 2;
  // data_hash is SHA-256 of the payload, hex.
  string data_hash = 3;
  uint64 size = 4;
  string poster = 5;
  // height is the block whose transaction carries the payload.
  int64 height = 6;
  // inbox_acc is the inbox accumulator after this post, hex.
  string inbox_acc = 7;
  // expires_at_height is the height from which the commitment is pruned.
  int64 expires_at_height = 8;
}

message QueryPostedDataRequest {
  string rollup_id = 1;
  uint64 sequence = 2;
}
message QueryPostedDataResponse { PostedDataView posted_data = 1; }

// InboxView is a rollup's inbox (v3.2.8).
message InboxView {
  string rollup_id = 1;
  string sequencing = 2;
  // head_sequence is the sequence of the last post (0 = none yet).
  uint64 head_sequence = 3;
  string head_acc = 4;
  // consumed_sequence is where the next based batch starts.
  uint64 consumed_sequence = 5;
  string consumed_acc = 6;
  // range_end and range_data_hash: the data_hash a based batch with
  // inbox_end = range_end must carry (hex). Empty when the end's commitment
  // is no longer retained.
  uint64 range_end = 7;
  string range_data_hash = 8;
}

message QueryInboxRequest {
  string rollup_id = 1;
  // inbox_end selects the range end for range_data_hash; 0 means the head.
  uint64 inbox_end = 2;
}
message QueryInboxResponse { InboxView inbox = 1; }

message QuerySubmitterBondRequest {
  string rollup_id = 1;
  string submitter = 2;
}
message QuerySubmitterBondResponse {
  // amount is the bond in uqor (0 when there is none).
  uint64 amount = 1;
  // last_submit_time is the block time (unix seconds) of the submitter's
  // last batch on the rollup, 0 when none.
  int64 last_submit_time = 2;
  // unbond_after is the block time from which MsgUnbondRollupSubmitter
  // succeeds.
  int64 unbond_after = 3;
}
