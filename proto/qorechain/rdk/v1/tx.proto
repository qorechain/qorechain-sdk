syntax = "proto3";
package qorechain.rdk.v1;

option go_package = "github.com/qorechain/qorechain-core/x/rdk/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

// Msg defines the rdk module's transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateRollup(MsgCreateRollup) returns (MsgCreateRollupResponse);
  rpc SubmitBatch(MsgSubmitBatch) returns (MsgSubmitBatchResponse);
  rpc ChallengeBatch(MsgChallengeBatch) returns (MsgChallengeBatchResponse);
  rpc ResolveChallenge(MsgResolveChallenge) returns (MsgResolveChallengeResponse);
  rpc PauseRollup(MsgPauseRollup) returns (MsgPauseRollupResponse);
  rpc ResumeRollup(MsgResumeRollup) returns (MsgResumeRollupResponse);
  rpc StopRollup(MsgStopRollup) returns (MsgStopRollupResponse);
  rpc ExecuteWithdrawal(MsgExecuteWithdrawal) returns (MsgExecuteWithdrawalResponse);
  // UpdateParams is served from v3.2.5 (rdk-params-route). Governance only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // SetVerificationKey is served from v3.2.7 (rdk-zk-verification-key). The
  // rollup's creator registers or replaces its ZK verification key until the
  // rollup's first batch is submitted.
  rpc SetVerificationKey(MsgSetVerificationKey) returns (MsgSetVerificationKeyResponse);
  // UpdateVerificationKey is served from v3.2.7 (rdk-zk-verification-key).
  // Governance only; it may change a rollup's key at any time.
  rpc UpdateVerificationKey(MsgUpdateVerificationKey) returns (MsgUpdateVerificationKeyResponse);
  // PostRollupData is served from v3.2.8 (rdk-post-rollup-data). It puts a
  // rollup's data on chain: the payload stays in the transaction, the chain
  // keeps a commitment and extends the rollup's inbox.
  rpc PostRollupData(MsgPostRollupData) returns (MsgPostRollupDataResponse);
  // SetRollupSequencing is served from v3.2.8 (rdk-based-sequencing).
  // Governance only; it moves an existing rollup to or from based sequencing.
  rpc SetRollupSequencing(MsgSetRollupSequencing) returns (MsgSetRollupSequencingResponse);
  // DepositToRollup is served from v3.2.8 (rdk-optimistic-reexec). It moves
  // uqor into a qledger-v1 rollup's deposit pool and appends a deposit entry
  // to its inbox.
  rpc DepositToRollup(MsgDepositToRollup) returns (MsgDepositToRollupResponse);
  // BondRollupSubmitter and UnbondRollupSubmitter are served from v3.2.8
  // (rdk-optimistic-reexec): a qledger-v1 rollup takes batches from any
  // account holding a submitter bond, which an upheld fraud proof pays to
  // the challenger.
  rpc BondRollupSubmitter(MsgBondRollupSubmitter) returns (MsgBondRollupSubmitterResponse);
  rpc UnbondRollupSubmitter(MsgUnbondRollupSubmitter) returns (MsgUnbondRollupSubmitterResponse);
  // SetRollupMembers is served from v3.2.8 (rdk-private-rollups). The
  // creator of a private rollup sets its member list.
  rpc SetRollupMembers(MsgSetRollupMembers) returns (MsgSetRollupMembersResponse);
}

message MsgCreateRollup {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  string profile = 3;
  string vm_type = 4;
  int64 stake_amount = 5;
  // verification_key optionally registers the rollup's ZK verification key at
  // creation, in the encoding MsgSetVerificationKey takes for the profile's
  // proof system. Accepted from v3.2.7 (rdk-zk-verification-key); below it a
  // message that carries one is refused.
  bytes verification_key = 6;
  // sequencing is "" (the rollup's sequencer settles, as before) or "based":
  // the rollup's transactions are ordered by their inclusion in this chain
  // (MsgPostRollupData, which anyone may send) and every batch must consume
  // the inbox in order. Accepted from v3.2.8 (rdk-based-sequencing), for zk
  // (snark) and based settlement only; below it a message that sets it is
  // refused.
  string sequencing = 7;
  // execution_vm is "" or "qledger-v1" (v3.2.8, rdk-optimistic-reexec): an
  // optimistic rollup whose batches the chain can re-execute in a fraud
  // proof. It must be based.
  string execution_vm = 8;
  // privacy is "" or "encapsulated" (v3.2.8, rdk-private-rollups): every
  // post is an ML-KEM-1024 envelope to the rollup's members. zk with a
  // Groth16 key only.
  string privacy = 9;
}
message MsgCreateRollupResponse {
  string rollup_id = 1 [(gogoproto.customname) = "RollupID"];
}

message MsgSubmitBatch {
  option (cosmos.msg.v1.signer) = "sequencer";
  string sequencer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  uint64 batch_index = 3;
  bytes state_root = 4;
  bytes prev_state_root = 5;
  uint64 tx_count = 6;
  bytes data_hash = 7;
  bytes proof = 8;
  // withdrawals_root commits the L2->L1 messages (withdrawals) in this batch as
  // a binary Merkle root. Empty when the batch carries no cross-layer messages.
  bytes withdrawals_root = 9;
  // anchor_signature, when present, is the rollup creator's Dilithium
  // signature over the v2 anchor sign bytes of this batch (see
  // x/multilayer/types.AnchorSignBytesV2). From v3.2.2 the batch is then
  // anchored in x/multilayer in the same transaction, and a refused anchor
  // refuses the batch. Without it the batch settles unanchored, as before.
  bytes anchor_signature = 10;
  // validator_set_hash is the rollup's validator-set commitment carried in
  // the anchor. Optional; covered by anchor_signature.
  bytes validator_set_hash = 11;
  // inbox_end is, for a based rollup, the sequence number of the last posted
  // data item this batch consumes; the batch covers the posts after the
  // rollup's consumed sequence up to it, and data_hash must be their inbox
  // range commitment. Zero and ignored for every other rollup. Accepted from
  // v3.2.8 (rdk-based-sequencing); below it a non-zero value is refused.
  uint64 inbox_end = 12;
}
message MsgSubmitBatchResponse {}

message MsgChallengeBatch {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  uint64 batch_index = 3;
  bytes proof = 4;
}
message MsgChallengeBatchResponse {}

message MsgResolveChallenge {
  option (cosmos.msg.v1.signer) = "resolver";
  string resolver = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  uint64 batch_index = 3;
  // fraud_upheld true: fraud confirmed -> batch rejected, challenger refunded +
  // rewarded from rollup stake. false: challenge dismissed -> challenger bond
  // forfeited to the rollup operator, batch eligible for finalization. The
  // chain verifies the stored fraud proof and refuses an assertion that does
  // not match. Before v3.2.5 only the rollup creator may resolve; from
  // rdk-challenge-settlement any account may.
  bool fraud_upheld = 4;
}
message MsgResolveChallengeResponse {}

message MsgPauseRollup {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  string reason = 3;
}
message MsgPauseRollupResponse {}

message MsgResumeRollup {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
}
message MsgResumeRollupResponse {}

message MsgStopRollup {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
}
message MsgStopRollupResponse {}

// MsgExecuteWithdrawal finalizes an L2->L1 cross-layer message: it proves a
// withdrawal leaf is committed in a finalized batch's withdrawals_root and pays
// the recipient from the rdk module escrow. Permissionless — anyone may submit a
// valid proof; the funds always go to the committed recipient. Replay-protected
// per (rollup_id, batch_index, withdrawal_index).
message MsgExecuteWithdrawal {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  uint64 batch_index = 3;
  uint64 withdrawal_index = 4;
  string recipient = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 6;
  int64 amount = 7;
  // proof are the binary-Merkle sibling hashes from the leaf to withdrawals_root.
  repeated bytes proof = 8;
}
message MsgExecuteWithdrawalResponse {}

// MsgUpdateParams replaces the rdk parameters wholesale. The fields are the
// module's Params, spelled out one by one (as x/multilayer does) because the
// parameters are stored as JSON by a hand-written struct whose encoding must
// not change. Governance only: authority must be the gov module account.
// Served from v3.2.5 (rdk-params-route).
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 max_rollups = 2;
  // min_stake_for_rollup is a uqor amount.
  int64 min_stake_for_rollup = 3;
  // rollup_creation_burn_rate is a decimal in [0, 1).
  string rollup_creation_burn_rate = 4;
  // default_challenge_window is in seconds. From rdk-rollup-params a new
  // optimistic rollup takes its challenge window from it.
  uint64 default_challenge_window = 5;
  uint64 max_da_blob_size = 6;
  uint64 blob_retention_blocks = 7;
  uint32 max_batches_per_block = 8;
  // finalized_batch_retention_blocks is how many blocks a finalized batch
  // keeps its proof before it is compacted; 0 means the default. A non-zero
  // value is refused before v3.2.8 (rdk-batch-compaction).
  uint64 finalized_batch_retention_blocks = 9;
  // The posted-data parameters (v3.2.8, rdk-post-rollup-data). Zero means
  // the default for each; a non-zero value is refused before the switch.
  // max_posted_data_bytes caps one MsgPostRollupData payload.
  uint64 max_posted_data_bytes = 10;
  // max_posted_data_bytes_per_block caps the billable bytes posted in one
  // block, all rollups together.
  uint64 max_posted_data_bytes_per_block = 11;
  // posted_data_fee_per_byte is the uqor fee per billable byte.
  uint64 posted_data_fee_per_byte = 12;
  // posted_data_retention_blocks is how long a posted-data commitment stays
  // in state.
  uint64 posted_data_retention_blocks = 13;
  // min_submitter_bond is the uqor bond a qledger-v1 rollup's batch
  // submitter must hold (v3.2.8, rdk-optimistic-reexec); 0 means the
  // default. A non-zero value is refused before the switch.
  uint64 min_submitter_bond = 14;
}
message MsgUpdateParamsResponse {}

// MsgSetVerificationKey registers or replaces the ZK verification key of a
// zk-settlement rollup. Signed by the rollup's creator, and only before the
// rollup's first batch; after that the key changes only through
// MsgUpdateVerificationKey. Served from v3.2.7 (rdk-zk-verification-key).
//
// verification_key is, for proof system "snark", a Groth16 BLS12-381
// verifying key in gnark's binary encoding (VerifyingKey.WriteTo) for a
// circuit with exactly four public inputs (prev_state_root, state_root,
// data_hash, withdrawals_root); for "stark", the 16-byte QSTK key of the
// transparent verifier. A key that does not decode is refused.
message MsgSetVerificationKey {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  bytes verification_key = 3;
  // proof_system is "snark" or "stark". Empty keeps the rollup's current
  // proof system.
  string proof_system = 4;
}
message MsgSetVerificationKeyResponse {}

// MsgUpdateVerificationKey replaces a zk-settlement rollup's verification key
// at any point of its life. Governance only: authority must be the gov module
// account. The key is validated as in MsgSetVerificationKey. Served from
// v3.2.7 (rdk-zk-verification-key).
message MsgUpdateVerificationKey {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  bytes verification_key = 3;
  // proof_system is "snark" or "stark". Empty keeps the rollup's current
  // proof system.
  string proof_system = 4;
}
message MsgUpdateVerificationKeyResponse {}

// MsgPostRollupData puts rollup data on chain (v3.2.8, rdk-post-rollup-data).
// The payload stays in this transaction, which is in the block; the chain
// stores a commitment (SHA-256 of data, size, poster, height) under the next
// sequence number of the rollup's inbox and extends the inbox accumulator.
// The poster pays a fee per billable byte (at least 1 KiB per post) into the
// fee collector. Who may post: the rollup's sequencer (or its creator when no
// sequencer address is set); anyone for a based rollup.
message MsgPostRollupData {
  option (cosmos.msg.v1.signer) = "poster";
  string poster = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  bytes data = 3;
}
message MsgPostRollupDataResponse {
  // sequence is the inbox sequence number the post was given (from 1).
  uint64 sequence = 1;
  // data_hash is SHA-256(data), the hash a batch references.
  bytes data_hash = 2;
}

// MsgSetRollupSequencing moves a rollup to based sequencing ("based") or back
// to its sequencer (""). Governance only: authority must be the gov module
// account. Moving to based starts the inbox at its current head. Served from
// v3.2.8 (rdk-based-sequencing).
message MsgSetRollupSequencing {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  string sequencing = 3;
}
message MsgSetRollupSequencingResponse {}

// MsgDepositToRollup moves amount uqor from depositor into a qledger-v1
// rollup's deposit pool and credits the L2 account (32-byte qledger-v1
// account id) through the rollup's inbox. Served from v3.2.8
// (rdk-optimistic-reexec).
message MsgDepositToRollup {
  option (cosmos.msg.v1.signer) = "depositor";
  string depositor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  bytes account = 3;
  uint64 amount = 4;
}
message MsgDepositToRollupResponse {
  // sequence is the inbox sequence of the deposit entry.
  uint64 sequence = 1;
}

// MsgBondRollupSubmitter adds amount uqor to submitter's bond on a
// qledger-v1 rollup. Served from v3.2.8 (rdk-optimistic-reexec).
message MsgBondRollupSubmitter {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  uint64 amount = 3;
}
message MsgBondRollupSubmitterResponse {
  uint64 bond = 1;
}

// MsgUnbondRollupSubmitter returns submitter's whole bond once a full
// challenge window has passed since its last batch. Served from v3.2.8
// (rdk-optimistic-reexec).
message MsgUnbondRollupSubmitter {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
}
message MsgUnbondRollupSubmitterResponse {
  uint64 returned = 1;
}

// MsgSetRollupMembers sets the member list of a private rollup (each member
// must publish an ML-KEM-1024 key in the x/pqc KEM registry) and starts a
// new membership epoch. Signed by the rollup's creator. Served from v3.2.8
// (rdk-private-rollups).
message MsgSetRollupMembers {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string rollup_id = 2 [(gogoproto.customname) = "RollupID"];
  repeated string members = 3;
}
message MsgSetRollupMembersResponse {
  uint64 epoch = 1;
}
