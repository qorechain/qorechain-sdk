syntax = "proto3";
package qorechain.rlconsensus.v1;

option go_package = "github.com/qorechain/qorechain-core/x/rlconsensus/types";

import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";

// Msg defines the rlconsensus module's governance-authority transactions.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SetAgentMode changes the RL agent operating mode (shadow/conservative/autonomous/paused).
  rpc SetAgentMode(MsgSetAgentMode) returns (MsgSetAgentModeResponse);
  // ResumeAgent resumes the agent from paused back to shadow mode.
  rpc ResumeAgent(MsgResumeAgent) returns (MsgResumeAgentResponse);
  // UpdatePolicy replaces the policy network weights (passed as JSON).
  rpc UpdatePolicy(MsgUpdatePolicy) returns (MsgUpdatePolicyResponse);
  // UpdateRewardWeights changes the reward function weighting.
  rpc UpdateRewardWeights(MsgUpdateRewardWeights) returns (MsgUpdateRewardWeightsResponse);
  // UpdateGasFloorBand sets whether, and inside which band, the agent's gas
  // price floor is applied to the x/feemarket minimum gas price
  // (rl-apply-gas-floor). Governance only.
  rpc UpdateGasFloorBand(MsgUpdateGasFloorBand) returns (MsgUpdateGasFloorBandResponse);
}

message MsgSetAgentMode {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  // mode is one of the AgentMode values (0 shadow, 1 conservative,
  // 2 autonomous, 3 paused). It stays a uint32 in Go: casting it to the uint8
  // AgentMode at decode time wrapped 256 to 0 and 257 to 1 before any check
  // could see the value that was sent.
  uint32 mode = 2 [(gogoproto.customname) = "Mode"];
}
message MsgSetAgentModeResponse {}

message MsgResumeAgent {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
}
message MsgResumeAgentResponse {}

message MsgUpdatePolicy {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  // JSON-encoded types.PolicyWeights (epoch + MLP config + weight vector).
  string weights_json = 2;
}
message MsgUpdatePolicyResponse {}

message MsgUpdateRewardWeights {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  string throughput = 2;
  string finality = 3;
  string decentralization = 4;
  string mev = 5 [(gogoproto.customname) = "MEV"];
  string failed_txs = 6;
}
message MsgUpdateRewardWeightsResponse {}

// MsgUpdateGasFloorBand sets the band within which the agent's gas price floor
// moves the x/feemarket min_gas_price. Decimals as strings, in min_gas_price
// units. With apply_enabled false nothing is applied and the band fields may
// be empty.
message MsgUpdateGasFloorBand {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  bool apply_enabled = 2;
  // min_gas_price and max_gas_price bound the applied value absolutely.
  string min_gas_price = 3;
  string max_gas_price = 4;
  // max_step_change bounds one step's change relative to the current value,
  // in (0, 0.5].
  string max_step_change = 5;
}
message MsgUpdateGasFloorBandResponse {}
