syntax = "proto3";
package qorechain.pqc.v1;

option go_package = "github.com/qorechain/qorechain-core/x/pqc/types";

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";

// EVM execution limits (v3.2.8). Governance may change them; until it does,
// the defaults in x/pqc/types/evm_limits.go apply.

// EVMLimitsMsg is the transaction service for the EVM execution limits.
service EVMLimitsMsg {
  option (cosmos.msg.v1.service) = true;

  // UpdateEVMLimits sets the limits. Governance only.
  rpc UpdateEVMLimits(MsgUpdateEVMLimits) returns (MsgUpdateEVMLimitsResponse);
}

// EVMLimits are the EVM execution limits.
message EVMLimits {
  // tx_max_gas is the most gas one EVM transaction may ask for (from
  // evm-tx-gas-cap). Zero means the default.
  uint64 tx_max_gas = 1;
  // precompile_input_max_bytes is the largest input a guarded stateful
  // precompile accepts (from evm-precompile-input-canonical). Zero means the
  // default.
  uint64 precompile_input_max_bytes = 2;
}

// MsgUpdateEVMLimits replaces the EVM execution limits.
message MsgUpdateEVMLimits {
  option (cosmos.msg.v1.signer) = "authority";

  // authority must be the governance module account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  EVMLimits limits = 2;
}

message MsgUpdateEVMLimitsResponse {}

// EVMLimitsQuery is the query service for the EVM execution limits.
service EVMLimitsQuery {
  // EVMLimits returns the limits governance set and the ones in force.
  rpc EVMLimits(QueryEVMLimitsRequest) returns (QueryEVMLimitsResponse) {
    option (google.api.http).get = "/qorechain/pqc/v1/evm_limits";
  }
}

message QueryEVMLimitsRequest {}

message QueryEVMLimitsResponse {
  // limits are what governance set (zero fields: not set).
  EVMLimits limits = 1;
  // tx_max_gas and precompile_input_max_bytes are the values in force.
  uint64 tx_max_gas = 2;
  uint64 precompile_input_max_bytes = 3;
}
